name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC para asumir el rol de AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync a S3
        run: |
          # HTML sin caché larga para que los cambios se vean de inmediato
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"
          # Resto de assets con caché larga
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*.html" --exclude "cv.pdf" --exclude "CV" --exclude "cv" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Publicar CV (/cv.pdf, /CV y /cv)
        run: |
          B="s3://${{ vars.S3_BUCKET }}"
          # /cv.pdf: se abre en el navegador
          aws s3 cp site/cv.pdf "$B/cv.pdf" \
            --content-type application/pdf \
            --cache-control "public, max-age=300"
          # /CV y /cv: descarga directa con nombre de archivo
          for key in CV cv; do
            aws s3 cp site/cv.pdf "$B/$key" \
              --content-type application/pdf \
              --content-disposition 'attachment; filename="Cristian_Estrada_CV.pdf"' \
              --cache-control "public, max-age=300"
          done

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
