name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC para asumir el rol de AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMPORAL: diagnóstico OIDC. Muestra solo los claims, nunca el token.
      - name: Debug OIDC claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c "import sys,json,base64;p=sys.stdin.read().split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ['sub','aud','iss','repository','ref','event_name']},indent=2))"
          echo "Role ARN (cuenta y nombre): $(echo "$ROLE_ARN" | sed -E 's/^arn:aws:iam::([0-9]+):role\/(.*)$/cuenta=\1 rol=\2/' | tr -d '\n' | sed 's/./& /g')"
          echo "Longitud ARN: ${#ROLE_ARN}"

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync a S3
        run: |
          # HTML sin caché larga para que los cambios se vean de inmediato
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"
          # Resto de assets con caché larga
          aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*.html" --exclude "cv.pdf" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
